name: betfair-probe
on:
  push:
    paths:
      - '.github/workflows/betfair-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Betfair endpoints
        run: |
          mkdir -p betfair-probe
          {
            echo "# Betfair probe (from GitHub Actions runner)"
            echo "probed_at_utc: $(date -u +%FT%TZ)"
            echo "runner_ip: $(curl -s --max-time 10 https://ifconfig.me || echo unknown)"
            echo ""
            for spec in "homepage|https://www.betfair.com/" "exchange_plus|https://www.betfair.com/exchange/plus/" "byevent|https://www.betfair.com/www/sports/exchange/readonly/v1/byevent?locale=en_GB&currencyCode=USD&eventIds=36232228&types=MARKET_STATE,RUNNER_DESCRIPTION"; do
              name="${spec%%|*}"
              url="${spec#*|}"
              code=$(curl -s -o "/tmp/$name.body" -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36" "$url") || code="curl_exit_$?"
              echo "## $name"
              echo "url: $url"
              echo "http_code: $code"
              echo "bytes: $(wc -c < "/tmp/$name.body" 2>/dev/null || echo 0)"
              echo "head: $(head -c 300 "/tmp/$name.body" 2>/dev/null | tr '\n' ' ')"
              echo ""
            done
          } | tee betfair-probe/result.md
      - name: Commit result back to repo
        run: |
          git config user.name "betfair-probe"
          git config user.email "betfair-probe@local"
          git add betfair-probe/result.md
          git commit -m "Betfair probe result $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "PUSH_FAILED"
